[package]
name = "tnm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small Tencent native monitoring agent"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
